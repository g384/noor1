<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نور الدين • PS4 Web Loader</title>
<style>
:root{--cyan:#20e8ff;--blue:#3f7cff;--violet:#9d5cff;--text:#f4fbff;--muted:#b7cddd}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;padding:0}
body{position:relative;overflow:hidden;background:#020812;color:var(--text);font:15px/1.45 "Segoe UI",Tahoma,Arial,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:linear-gradient(180deg,rgba(0,6,18,.24),rgba(0,5,16,.68)),url("custom_background.jpg") center center/cover no-repeat}
#grid{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(32,232,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(32,232,255,.045) 1px,transparent 1px);background-size:42px 42px}
#scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(transparent,rgba(32,232,255,.025),transparent);background-size:100% 7px;opacity:.55}
#brand{position:relative;z-index:5;min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:9px 22px;background:rgba(2,7,18,.62);border-bottom:1px solid rgba(96,224,255,.32);backdrop-filter:blur(13px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.brand-left{display:flex;align-items:center;gap:13px}
#brand img{width:50px;height:50px;margin:0;border-radius:14px;object-fit:cover;border:1px solid rgba(125,235,255,.55);box-shadow:0 0 24px rgba(32,232,255,.25)}
#brand b{font-size:27px;font-weight:950;letter-spacing:.03em;color:#f4fbff;vertical-align:middle;text-shadow:0 0 18px rgba(32,232,255,.25)}
.brand-sub{font-size:10px;color:var(--cyan);letter-spacing:.2em;margin-top:1px}
.brand-badge{padding:7px 11px;border:1px solid rgba(32,232,255,.27);border-radius:999px;background:rgba(0,18,38,.46);font-size:10px;color:#bcecff;letter-spacing:.13em}
#wrap{position:relative;z-index:3;width:min(760px,calc(100% - 34px));min-height:400px;margin:7vh auto 0;padding:34px 30px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(145deg,rgba(5,15,33,.68),rgba(3,8,20,.45));border:1px solid rgba(71,221,255,.30);border-radius:28px;box-shadow:0 28px 90px rgba(0,0,0,.58),0 0 55px rgba(32,130,255,.15);backdrop-filter:blur(15px)}
#wrap:before,#wrap:after{content:"";position:absolute;width:70px;height:70px;pointer-events:none}
#wrap:before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);border-radius:28px 0 0}
#wrap:after{right:-1px;bottom:-1px;border-right:2px solid var(--violet);border-bottom:2px solid var(--violet);border-radius:0 0 28px}
#hero{width:120px;height:120px;object-fit:cover;border-radius:25px;border:1px solid rgba(140,240,255,.52);box-shadow:0 0 0 8px rgba(32,232,255,.045),0 0 45px rgba(32,232,255,.30);margin-bottom:17px}
#state{font-size:27px;font-weight:900;margin:0 0 7px;text-shadow:0 0 18px rgba(32,232,255,.22)}
#det{font-size:13px;color:var(--muted);margin:0 0 12px}
#det b{color:#fff}
#cache{font-size:12px;color:#c0d5e3;padding:8px 14px;border-radius:999px;border:1px solid rgba(117,226,255,.18);background:rgba(0,12,28,.48);min-height:15px}
#cache.cacheok{color:#7df5d2;border-color:rgba(125,245,210,.30)}
#phone{font-size:19px;font-weight:900;letter-spacing:.12em;color:#9ff6ff;margin-top:18px;text-shadow:0 0 16px rgba(32,232,255,.35)}
#rights{position:fixed;z-index:5;left:0;right:0;bottom:9px;text-align:center;font-size:11px;color:rgba(226,242,250,.74)}
.ok{color:#7fd0a0}.bad{color:#ff8d9b}.warn{color:#ffe27a}
@media(max-width:600px){#brand{padding:8px 13px}.brand-badge{display:none}#brand b{font-size:22px}#brand img{width:43px;height:43px}#wrap{width:calc(100% - 18px);min-height:380px;margin-top:5vh;padding:26px 15px}#hero{width:100px;height:100px}#state{font-size:23px}#phone{font-size:16px}}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div><div id="scan"></div>
<div id="brand">
  <div class="brand-left">
    <img src="logo_raw.png" alt="" width="50" height="50">
    <div><b>نور الدين</b><div class="brand-sub">PS4 • WEB LOADER</div></div>
  </div>
  <div class="brand-badge">11.00 — 13.00</div>
</div>
<div id="wrap">
  <img id="hero" src="logo_raw.png" alt="">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
  <div id="phone">07777476714</div>
</div>
<div id="rights">© نور الدين — جميع الحقوق محفوظة</div>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;
    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }
    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;
    function go() { setState("loading " + bug + " chain...", "warn"); location.replace(target); }
    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }
    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true); go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true); go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading", function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run", function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () { setCache("cached -- offline ready", true); go(); }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
