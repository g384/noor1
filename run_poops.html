<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نور الدين • PS4 Poops</title><style>
:root{--cyan:#20e8ff;--violet:#9d5cff;--text:#f4fbff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;padding:0;overflow:hidden}
body{position:relative;background:#020812;color:var(--text);font:15px/1.45 "Segoe UI",Tahoma,Arial,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:linear-gradient(180deg,rgba(0,6,18,.28),rgba(0,5,16,.72)),url("custom_background.jpg") center/cover no-repeat}
#grid{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(32,232,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(32,232,255,.045) 1px,transparent 1px);background-size:42px 42px}
#brand{position:relative;z-index:5;min-height:66px;display:flex;align-items:center;padding:8px 18px;background:rgba(2,7,18,.62);border-bottom:1px solid rgba(96,224,255,.3);backdrop-filter:blur(13px)}
#brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid rgba(125,235,255,.5);box-shadow:0 0 20px rgba(32,232,255,.2);margin-left:11px}
#brand b{font-size:25px;font-weight:950}.sub{font-size:9px;color:var(--cyan);letter-spacing:.18em}
#wrap{position:relative;z-index:3;padding:18px}
#state{display:block;font-size:22px;font-weight:900;margin:0 0 10px}
#out{white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:rgba(3,9,21,.78);border:1px solid rgba(117,226,255,.24);border-radius:16px;padding:14px;height:calc(100vh - 145px);overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(12px)}
#rights{position:fixed;z-index:5;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:rgba(226,242,250,.72)}
.ok{color:#7fd0a0}.bad{color:#ff8d9b}.warn{color:#ffe27a}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div>
<div id="brand"><img src="logo_raw.png" alt=""><div><b>نور الدين</b><div class="sub">PS4 • WEB LOADER • 11.00 — 13.00</div></div></div>
<div id="wrap"><div id="state">loading poops chain...</div><div id="out"></div></div>
<div id="rights">© نور الدين — 07777476714 — جميع الحقوق محفوظة</div>
<script type="module">import "./chain_poops.js";</script>
</body></html>
